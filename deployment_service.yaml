apiVersion: apps/v1
kind: Deployment
metadata:
  name: blogapp-deployment
  namespace: qa
spec:
  selector:
    matchLabels:
      app: blog-app
  replicas: 2
  template:
    metadata:
      labels:
        app: blog-app
    spec:
      containers:
        - name: blog-app
          image: localhost:5000/blogapp-qa:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8282

---
apiVersion: v1
kind: Service
metadata:
  name: blogapp-svc
spec:
  selector:
    app: blog-app
  ports:
    - protocol: TCP
      port: 8282
      targetPort: 8282
  type: LoadBalancer
